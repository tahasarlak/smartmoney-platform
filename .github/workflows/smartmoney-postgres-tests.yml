
name: SmartMoney V11 - PostgreSQL Tests

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smartmoney-postgres-tests
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-postgres.txt

      - name: Validate application imports
        run: |
          python -c "from app import database, market_store, signal_journal; print('IMPORTS PASSED')"

      - name: Check Python syntax
        run: |
          python -m compileall -q app tests
          echo "SYNTAX PASSED"

      - name: Verify Neon connectivity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url

          raw = os.environ.get("DATABASE_URL", "")
          if not raw:
              raise SystemExit("DATABASE_URL is missing")

          url = make_url(raw)
          if url.get_backend_name() != "postgresql":
              raise SystemExit("Expected PostgreSQL URL")

          if not url.host or not url.database:
              raise SystemExit("Invalid database configuration")

          dsn = url.set(drivername="postgresql").render_as_string(
              hide_password=False
          )

          with psycopg.connect(
              dsn,
              connect_timeout=20,
              sslmode="require"
          ) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      "SELECT current_database(), current_user"
                  )
                  db, user = cur.fetchone()
                  print("Neon connected:", db)
                  print("Database user:", user)

          print("NEON CONNECTIVITY PASSED")
          PY

      - name: Run backend tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is missing."
            exit 1
          fi

          python -m pytest tests -v --tb=short
