name: TRADF - Apply Neon Database Migrations

on:
  workflow_dispatch:
    inputs:
      confirm_migration:
        description: "I verified the target Neon database and approve applying pending Alembic migrations."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tradf-neon-migrations-development
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply and verify database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development

    steps:
      - name: Require explicit confirmation
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm_migration }}
        run: |
          if [[ "$CONFIRM" != "true" ]]; then
            echo "::error::Migration was not approved."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify migration chain
        shell: bash
        run: |
          set -euo pipefail
          required=(
            backend/alembic.ini
            backend/migrations/env.py
            backend/migrations/versions/0001_initial_smartmoney_v11.py
            backend/migrations/versions/0002_phase7_forward_testing.py
            backend/migrations/versions/0003_phase9_paper_execution.py
            backend/migrations/versions/0004_tradf_production_infrastructure.py
            backend/migrations/versions/0005_tradf_worker_heartbeat.py
            backend/migrations/versions/0006_mt5_market_data.py
            backend/app/production_models.py
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "::error::Missing $file"; exit 1; }
          done
          grep -q 'revision = "0006_mt5_market_data"' backend/migrations/versions/0006_mt5_market_data.py
          grep -q 'down_revision = "0005_tradf_worker_heartbeat"' backend/migrations/versions/0006_mt5_market_data.py
          grep -q 'from app import production_models' backend/migrations/env.py
          echo "Migration chain through 0006 is present."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate database secret without printing it
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DIRECT_URL:-}" ]]; then
            echo "::error::GitHub Environment secret DIRECT_URL is missing."
            exit 1
          fi
          case "$DIRECT_URL" in
            postgresql://*|postgres://*|postgresql+psycopg://*) ;;
            *) echo "::error::DIRECT_URL must be a PostgreSQL connection URL."; exit 1 ;;
          esac
          echo "DIRECT_URL is configured."

      - name: Show migration heads
        working-directory: backend
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          python -m alembic heads
          python -m alembic history

      - name: Apply pending migrations
        working-directory: backend
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: python -m alembic upgrade head

      - name: Verify revision and MT5 tables
        working-directory: backend
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text
          from sqlalchemy.engine import make_url

          url = make_url(os.environ["DIRECT_URL"])
          if url.drivername in ("postgres", "postgresql"):
              url = url.set(drivername="postgresql+psycopg")
          engine = create_engine(
              url,
              pool_pre_ping=True,
              connect_args={"connect_timeout": 20, "sslmode": "require"},
          )
          required = {
              "tradf_mt5_market_candles",
              "tradf_mt5_bridge_heartbeats",
              "tradf_worker_heartbeats",
              "tradf_exchange_credentials",
              "tradf_exchange_orders",
              "tradf_global_kill_switch",
              "tradf_user_kill_switches",
              "tradf_scheduler_jobs",
              "tradf_paper_burnin_samples",
          }
          try:
              with engine.connect() as connection:
                  revision = connection.execute(
                      text("SELECT version_num FROM alembic_version")
                  ).scalar_one()
                  if revision != "0006_mt5_market_data":
                      raise RuntimeError(f"Expected 0006_mt5_market_data, got {revision}")
                  missing = sorted(required - set(inspect(connection).get_table_names()))
                  if missing:
                      raise RuntimeError("Missing tables: " + ", ".join(missing))
                  print("Alembic revision:", revision)
                  print("All required production and MT5 market-data tables exist.")
                  print("DATABASE MIGRATION VERIFICATION: SUCCESS")
          finally:
              engine.dispose()
          PY
