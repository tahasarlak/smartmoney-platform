
name: SmartMoney V11 - Initialize Neon Schema

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type INITIALIZE_DEVELOPMENT to create the clean development schema"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-schema-init-development
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Validate confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "INITIALIZE_DEVELOPMENT" ]; then
            echo "Invalid confirmation."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-postgres.txt

      - name: Validate Neon target
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          import psycopg

          dsn = os.environ.get("DIRECT_URL", "")

          if not dsn:
              sys.exit("DIRECT_URL secret is missing")

          if dsn.startswith("postgresql+psycopg://"):
              dsn = dsn.replace(
                  "postgresql+psycopg://",
                  "postgresql://",
                  1
              )

          with psycopg.connect(
              dsn,
              connect_timeout=20,
              sslmode="require"
          ) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT current_database(), current_schema()
                  """)
                  db, schema = cur.fetchone()

                  print("Database:", db)
                  print("Schema:", schema)

                  if schema != "public":
                      sys.exit("Unexpected database schema")

                  cur.execute("""
                      SELECT COUNT(*)
                      FROM information_schema.tables
                      WHERE table_schema = 'public'
                      AND table_type = 'BASE TABLE'
                      AND table_name != 'alembic_version'
                  """)

                  count = cur.fetchone()[0]

                  if count:
                      sys.exit(
                          f"Refusing initialization: "
                          f"{count} application tables already exist."
                      )

                  print("Preflight passed.")

          PY

      - name: Apply Alembic migrations
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          alembic upgrade head

      - name: Verify database schema
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          import psycopg

          dsn = os.environ["DIRECT_URL"]

          if dsn.startswith("postgresql+psycopg://"):
              dsn = dsn.replace(
                  "postgresql+psycopg://",
                  "postgresql://",
                  1
              )

          required = {
              "v11_users",
              "v11_sessions",
              "v11_portfolios",
              "v11_broker_accounts",
              "v11_paper_orders",
              "v11_audit_events",
              "v11_backtest_runs",
              "market_prices",
              "market_watchlist",
              "signals",
              "signal_events",
              "alembic_version",
          }

          with psycopg.connect(
              dsn,
              connect_timeout=20,
              sslmode="require"
          ) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT table_name
                      FROM information_schema.tables
                      WHERE table_schema = 'public'
                      AND table_type = 'BASE TABLE'
                      ORDER BY table_name
                  """)

                  names = {row[0] for row in cur.fetchall()}

          for name in sorted(names):
              print(name)

          missing = required - names

          if missing:
              sys.exit(
                  "Missing tables: " + ", ".join(sorted(missing))
              )

          print("SUCCESS: SmartMoney V11 schema verified.")
          PY
