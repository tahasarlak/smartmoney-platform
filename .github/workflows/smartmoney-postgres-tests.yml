name: SmartMoney V11 - PostgreSQL Integration

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reset_public_schema:
        description: "پاک‌سازی کامل schema عمومی Neon قبل از Migration (تمام داده‌های public حذف می‌شوند)"
        required: true
        type: boolean
        default: false
      reset_confirmation:
        description: "فقط در صورت فعال کردن پاک‌سازی، عبارت RESET_PUBLIC_SCHEMA را وارد کن"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: smartmoney-postgres-integration
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: development

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Neon secrets
        run: |
          python - <<'PY'
          import os
          from sqlalchemy.engine import make_url

          for key in ("DATABASE_URL", "DIRECT_URL"):
              raw = os.environ.get(key, "").strip()
              if not raw:
                  raise SystemExit(f"{key} GitHub Environment secret is missing")
              url = make_url(raw)
              if url.get_backend_name() != "postgresql":
                  raise SystemExit(f"{key} must point to PostgreSQL")
              if not url.host or not url.database:
                  raise SystemExit(f"{key} is missing host/database")
              print(f"{key}: PostgreSQL host={url.host}, database={url.database}")

          pooled = make_url(os.environ["DATABASE_URL"])
          direct = make_url(os.environ["DIRECT_URL"])
          if pooled.database != direct.database:
              raise SystemExit("DATABASE_URL and DIRECT_URL must target the same Neon database")
          print("NEON SECRET VALIDATION PASSED")
          PY

      - name: Validate Python syntax and imports
        run: |
          python -m compileall -q app tests
          python - <<'PY'
          from app import database, db_models, v11_platform, market_store, signal_journal, forward_testing, execution_engine
          from app.live_price_monitor import LivePriceMonitor
          print("PYTHON SYNTAX AND IMPORTS PASSED")
          PY

      - name: Optional clean reset of Neon public schema
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_public_schema }}
        env:
          RESET_CONFIRMATION: ${{ inputs.reset_confirmation }}
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url

          if os.environ.get("RESET_CONFIRMATION") != "RESET_PUBLIC_SCHEMA":
              raise SystemExit("Reset refused: confirmation must equal RESET_PUBLIC_SCHEMA")

          url = make_url(os.environ["DIRECT_URL"])
          dsn = url.set(drivername="postgresql").render_as_string(hide_password=False)

          with psycopg.connect(dsn, connect_timeout=30, sslmode="require", autocommit=True) as conn:
              with conn.cursor() as cur:
                  cur.execute("DROP SCHEMA IF EXISTS public CASCADE")
                  cur.execute("CREATE SCHEMA public")
                  cur.execute("GRANT ALL ON SCHEMA public TO CURRENT_USER")
                  cur.execute("GRANT ALL ON SCHEMA public TO PUBLIC")

          print("NEON PUBLIC SCHEMA RESET COMPLETED")
          PY

      - name: Verify pooled and direct Neon connections
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url

          for label, key in (("POOLED", "DATABASE_URL"), ("DIRECT", "DIRECT_URL")):
              url = make_url(os.environ[key])
              dsn = url.set(drivername="postgresql").render_as_string(hide_password=False)
              with psycopg.connect(dsn, connect_timeout=30, sslmode="require") as conn:
                  with conn.cursor() as cur:
                      cur.execute("SELECT current_database(), current_user, version()")
                      db, user, version = cur.fetchone()
                      print(f"{label} CONNECTION OK | database={db} | user={user}")
                      print(version.splitlines()[0])
          PY

      - name: Enforce PostgreSQL-only application storage
        run: |
          if grep -RInE 'sqlite3|sqlite://' app; then
            echo "SQLite references remain in the application package."
            exit 1
          fi
          echo "POSTGRESQL-ONLY APPLICATION STORAGE PASSED"

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Verify Alembic revision
        run: |
          alembic current
          alembic heads

      - name: Run complete backend test suite
        run: python -m pytest tests -v --tb=short

      - name: Verify PostgreSQL schema and constraints
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url

          url = make_url(os.environ["DATABASE_URL"])
          dsn = url.set(drivername="postgresql").render_as_string(hide_password=False)

          required = {
              "v11_users", "v11_sessions", "v11_portfolios",
              "v11_broker_accounts", "v11_paper_orders",
              "v11_audit_events", "v11_backtest_runs",
              "market_prices", "market_watchlist", "signals",
              "signal_events", "alembic_version",
              "v11_forward_test_runs", "v11_forward_test_trades",
              "v11_forward_test_events", "v11_execution_trades", "v11_execution_events",
          }

          with psycopg.connect(dsn, connect_timeout=30, sslmode="require") as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT table_name
                      FROM information_schema.tables
                      WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
                  """)
                  tables = {row[0] for row in cur.fetchall()}
                  missing = required - tables
                  if missing:
                      raise SystemExit("Missing tables: " + ", ".join(sorted(missing)))

                  cur.execute("""
                      SELECT column_name
                      FROM information_schema.columns
                      WHERE table_schema='public' AND table_name='signals'
                  """)
                  signal_columns = {row[0] for row in cur.fetchall()}
                  required_signal_columns = {
                      "user_id", "visibility", "symbol", "direction",
                      "status", "entry", "stop_loss", "tp1", "tp2", "tp3"
                  }
                  missing_columns = required_signal_columns - signal_columns
                  if missing_columns:
                      raise SystemExit("Missing signal columns: " + ", ".join(sorted(missing_columns)))

                  cur.execute("SELECT version_num FROM alembic_version")
                  revisions = [row[0] for row in cur.fetchall()]
                  if revisions != ["0003_phase9_paper_execution"]:
                      raise SystemExit(f"Unexpected Alembic revision state: {revisions}")

                  cur.execute("""
                      SELECT column_name
                      FROM information_schema.columns
                      WHERE table_schema='public' AND table_name='v11_execution_trades'
                  """)
                  execution_columns = {row[0] for row in cur.fetchall()}
                  required_execution_columns = {
                      "user_id", "portfolio_id", "account_id", "idempotency_key",
                      "symbol", "side", "status", "planned_entry", "avg_entry_price",
                      "stop_loss", "tp1", "tp2", "tp3", "quantity", "remaining_quantity",
                      "tp1_hit", "tp2_hit", "tp3_hit", "realized_pnl", "fees_paid",
                      "last_event_time_ms", "last_event_id",
                  }
                  missing_execution_columns = required_execution_columns - execution_columns
                  if missing_execution_columns:
                      raise SystemExit("Missing execution columns: " + ", ".join(sorted(missing_execution_columns)))

                  cur.execute("""
                      SELECT constraint_name
                      FROM information_schema.table_constraints
                      WHERE table_schema='public' AND table_name='v11_execution_trades'
                        AND constraint_type='UNIQUE'
                  """)
                  unique_constraints = {row[0] for row in cur.fetchall()}
                  if "uq_execution_user_idempotency" not in unique_constraints:
                      raise SystemExit("Execution idempotency unique constraint is missing")

                  cur.execute("""
                      SELECT column_name
                      FROM information_schema.columns
                      WHERE table_schema='public' AND table_name='v11_execution_events'
                  """)
                  execution_event_columns = {row[0] for row in cur.fetchall()}
                  required_event_columns = {
                      "trade_id", "source_event_id", "sequence_no", "event_type",
                      "market_price", "fill_price", "quantity", "pnl", "fee",
                      "event_time_ms", "event_time", "details_json",
                  }
                  missing_event_columns = required_event_columns - execution_event_columns
                  if missing_event_columns:
                      raise SystemExit("Missing execution-event columns: " + ", ".join(sorted(missing_event_columns)))

                  cur.execute("""
                      SELECT constraint_name
                      FROM information_schema.table_constraints
                      WHERE table_schema='public' AND table_name='v11_execution_events'
                        AND constraint_type='UNIQUE'
                  """)
                  event_unique_constraints = {row[0] for row in cur.fetchall()}
                  if "uq_execution_event_source_sequence" not in event_unique_constraints:
                      raise SystemExit("Execution event idempotency constraint is missing")

                  cur.execute("""
                      SELECT column_name
                      FROM information_schema.columns
                      WHERE table_schema='public' AND table_name='v11_forward_test_trades'
                  """)
                  forward_columns = {row[0] for row in cur.fetchall()}
                  required_forward_columns = {
                      "run_id", "signal_id", "status", "planned_entry",
                      "actual_entry", "stop_loss", "tp1", "tp2", "tp3",
                      "quantity", "remaining_quantity", "realized_pnl",
                      "fees_paid", "last_event_time_ms", "last_event_id"
                  }
                  missing_forward_columns = required_forward_columns - forward_columns
                  if missing_forward_columns:
                      raise SystemExit("Missing forward-test columns: " + ", ".join(sorted(missing_forward_columns)))

          print("POSTGRESQL PHASE 9 EXECUTION SCHEMA VERIFICATION PASSED")
          PY
