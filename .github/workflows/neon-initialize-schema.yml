
name: SmartMoney V11 - Initialize Neon Schema

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type INITIALIZE_DEVELOPMENT"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: smartmoney-neon-schema-development
  cancel-in-progress: false

jobs:
  migrate:
    name: Initialize PostgreSQL Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development

    steps:

      # --------------------------------------------------
      # 1. Validate confirmation
      # --------------------------------------------------

      - name: Validate confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "INITIALIZE_DEVELOPMENT" ]; then
            echo "::error::Invalid confirmation."
            exit 1
          fi

          echo "Confirmation accepted."

      # --------------------------------------------------
      # 2. Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 3. Inspect repository structure
      # --------------------------------------------------

      - name: Inspect project structure
        shell: bash
        run: |
          echo "===== PROJECT ROOT ====="
          pwd
          ls -la

          echo "===== BACKEND DIRECTORY ====="

          if [ ! -d "backend" ]; then
            echo "::error::Backend directory not found."
            exit 1
          fi

          ls -la backend

          required_files=(
            "backend/requirements.txt"
            "backend/requirements-postgres.txt"
            "backend/alembic.ini"
            "backend/migrations/env.py"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Required file missing: $file"
              exit 1
            fi
            echo "FOUND: $file"
          done

          if [ ! -d "backend/migrations/versions" ]; then
            echo "::error::Alembic versions directory missing."
            exit 1
          fi

          if ! find backend/migrations/versions \
            -maxdepth 1 -name '*.py' \
            | grep -q .; then
            echo "::error::No Alembic migration files found."
            exit 1
          fi

          echo "Project structure validated."

      # --------------------------------------------------
      # 4. Python
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-postgres.txt

      # --------------------------------------------------
      # 5. Install dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            -r backend/requirements.txt

          python -m pip install \
            -r backend/requirements-postgres.txt

      # --------------------------------------------------
      # 6. Validate configuration
      # --------------------------------------------------

      - name: Validate database configuration
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          from sqlalchemy.engine import make_url

          for name in ("DIRECT_URL", "DATABASE_URL"):
              value = os.environ.get(name, "")

              if not value:
                  sys.exit(f"{name} secret is missing")

              try:
                  url = make_url(value)
              except Exception:
                  sys.exit(f"{name} has invalid URL format")

              if url.get_backend_name() != "postgresql":
                  sys.exit(f"{name} must use PostgreSQL")

              if not url.host or not url.database:
                  sys.exit(f"{name} is incomplete")

              if not url.password:
                  sys.exit(f"{name} password is missing")

              print(f"{name}: configured")
              print(f"Host: {url.host}")
              print(f"Database: {url.database}")

          print("Database configuration validated.")
          PY

      # --------------------------------------------------
      # 7. Validate clean development database
      # --------------------------------------------------

      - name: Neon preflight
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          import psycopg

          dsn = os.environ["DIRECT_URL"]

          if dsn.startswith("postgresql+psycopg://"):
              dsn = dsn.replace(
                  "postgresql+psycopg://",
                  "postgresql://",
                  1
              )

          with psycopg.connect(
              dsn,
              connect_timeout=20,
              sslmode="require"
          ) as conn:

              with conn.cursor() as cur:

                  cur.execute("""
                      SELECT current_database(),
                             current_schema(),
                             current_user
                  """)

                  db, schema, user = cur.fetchone()

                  print("Database:", db)
                  print("Schema:", schema)
                  print("User:", user)

                  if schema != "public":
                      sys.exit("Unexpected database schema.")

                  cur.execute("""
                      SELECT table_name
                      FROM information_schema.tables
                      WHERE table_schema = 'public'
                        AND table_type = 'BASE TABLE'
                        AND table_name <> 'alembic_version'
                  """)

                  existing = [
                      row[0] for row in cur.fetchall()
                  ]

                  if existing:
                      print("Existing application tables:")
                      for name in existing:
                          print(" -", name)

                      sys.exit(
                          "Database is not clean. "
                          "Initialization cancelled."
                      )

                  print("Neon preflight PASSED.")
          PY

      # --------------------------------------------------
      # 8. Validate Alembic configuration
      # --------------------------------------------------

      - name: Validate Alembic configuration
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          cd backend

          python -m alembic heads

          python -m alembic current

      # --------------------------------------------------
      # 9. Apply migrations
      # --------------------------------------------------

      - name: Apply Alembic migrations
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          cd backend

          python -m alembic upgrade head

      # --------------------------------------------------
      # 10. Verify schema
      # --------------------------------------------------

      - name: Verify database tables
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          import psycopg

          dsn = os.environ["DIRECT_URL"]

          if dsn.startswith("postgresql+psycopg://"):
              dsn = dsn.replace(
                  "postgresql+psycopg://",
                  "postgresql://",
                  1
              )

          required = {
              "v11_users",
              "v11_sessions",
              "v11_portfolios",
              "v11_broker_accounts",
              "v11_paper_orders",
              "v11_audit_events",
              "v11_backtest_runs",
              "market_prices",
              "market_watchlist",
              "signals",
              "signal_events",
              "alembic_version",
          }

          with psycopg.connect(
              dsn,
              connect_timeout=20,
              sslmode="require"
          ) as conn:

              with conn.cursor() as cur:

                  cur.execute("""
                      SELECT table_name
                      FROM information_schema.tables
                      WHERE table_schema = 'public'
                        AND table_type = 'BASE TABLE'
                      ORDER BY table_name
                  """)

                  names = {
                      row[0] for row in cur.fetchall()
                  }

                  print("===== DATABASE TABLES =====")

                  for name in sorted(names):
                      print("OK:", name)

                  missing = required - names

                  if missing:
                      print("Missing tables:", sorted(missing))
                      sys.exit(1)

                  print("All required tables exist.")

                  cur.execute("""
                      SELECT version_num
                      FROM alembic_version
                  """)

                  versions = cur.fetchall()

                  print("Alembic versions:", versions)

          print("SUCCESS: Neon schema initialized.")
          PY

      # --------------------------------------------------
      # 11. Final status
      # --------------------------------------------------

      - name: Final result
        run: |
          echo "=================================="
          echo "SMARTMONEY V11"
          echo "NEON SCHEMA INITIALIZATION PASSED"
          echo "=================================="
