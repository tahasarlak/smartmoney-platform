
    
  
name: TRADF - Apply Neon Database Migrations

on:
  workflow_dispatch:
    inputs:
      confirm_migration:
        description: "I have verified the target Neon database and approve applying all pending Alembic migrations."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tradf-neon-migrations-development
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply and verify database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Configure this GitHub Environment with the DIRECT_URL secret.
    # Add required reviewers in GitHub Environment protection rules if desired.
    environment: development

    steps:
      - name: Require explicit confirmation
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm_migration }}
        run: |
          if [[ "$CONFIRM" != "true" ]]; then
            echo "::error::Migration was not approved. Set confirm_migration to true."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify migration files and chain
        shell: bash
        run: |
          set -euo pipefail

          required=(
            backend/alembic.ini
            backend/migrations/env.py
            backend/migrations/versions/0001_initial_smartmoney_v11.py
            backend/migrations/versions/0002_phase7_forward_testing.py
            backend/migrations/versions/0003_phase9_paper_execution.py
            backend/migrations/versions/0004_tradf_production_infrastructure.py
            backend/migrations/versions/0005_tradf_worker_heartbeat.py
            backend/app/production_models.py
          )

          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required migration source is missing: $file"
              exit 1
            fi
          done

          grep -q 'from app import production_models' backend/migrations/env.py || {
            echo "::error::Alembic env.py does not register production_models."
            exit 1
          }

          grep -q 'revision = "0005_tradf_worker_heartbeat"' \
            backend/migrations/versions/0005_tradf_worker_heartbeat.py
          grep -q 'down_revision = "0004_tradf_production_infrastructure"' \
            backend/migrations/versions/0005_tradf_worker_heartbeat.py

          echo "Required migration files and expected 0004 -> 0005 chain found."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

