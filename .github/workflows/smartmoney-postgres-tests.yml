name: SmartMoney V11 - PostgreSQL Tests

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smartmoney-postgres-tests
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-postgres.txt

      - name: Validate database configuration
        run: |
          python - <<'PY'
          import os
          from sqlalchemy.engine import make_url

          raw = os.environ.get("DATABASE_URL", "")
          if not raw:
              raise SystemExit("DATABASE_URL secret is missing")

          url = make_url(raw)
          if url.get_backend_name() != "postgresql":
              raise SystemExit("DATABASE_URL must be PostgreSQL")

          print("Database host:", url.host)
          print("Database name:", url.database)
          print("PostgreSQL configuration passed.")
          PY

      - name: Validate imports
        run: |
          python -c "from app import database, db_models, v11_platform, market_store, signal_journal; print('IMPORTS PASSED')"

      - name: Validate Python syntax
        run: |
          python -m compileall -q app tests
          echo "SYNTAX PASSED"

      - name: Verify Neon connection
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url

          url = make_url(os.environ["DATABASE_URL"])
          dsn = url.set(drivername="postgresql").render_as_string(
              hide_password=False
          )

          with psycopg.connect(
              dsn,
              connect_timeout=30,
              sslmode="require"
          ) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      "SELECT current_database(), current_user, version()"
                  )
                  db, user, version = cur.fetchone()
                  print("DATABASE:", db)
                  print("USER:", user)
                  print("VERSION:", version)

          print("NEON CONNECTION PASSED")
          PY

      - name: Apply Alembic migrations
        run: |
          alembic upgrade head

      - name: Verify Alembic
        run: |
          alembic current
          alembic heads

      - name: Run complete backend tests
        run: |
          python -m pytest tests -v --tb=short

      - name: Database final verification
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url

          url = make_url(os.environ["DATABASE_URL"])
          dsn = url.set(drivername="postgresql").render_as_string(
              hide_password=False
          )

          with psycopg.connect(dsn, sslmode="require") as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT table_name
                      FROM information_schema.tables
                      WHERE table_schema = 'public'
                      AND table_type = 'BASE TABLE'
                      ORDER BY table_name
                  """)
                  tables = [r[0] for r in cur.fetchall()]

                  for table in tables:
                      print(table)

                  required = {
                      "v11_users",
                      "v11_sessions",
                      "v11_portfolios",
                      "v11_broker_accounts",
                      "v11_paper_orders",
                      "v11_audit_events",
                      "v11_backtest_runs",
                      "market_prices",
                      "market_watchlist",
                      "signals",
                      "signal_events",
                      "alembic_version"
                  }

                  missing = required - set(tables)
                  if missing:
                      raise SystemExit(
                          "Missing tables: " + ", ".join(sorted(missing))
                      )

          print("FINAL DATABASE VERIFICATION PASSED")
          PY